name: BCHL Auto Sync

on:
  schedule:
    - cron: '15 10 * * *'
    - cron: '15 22 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync MansHockey from BCHL
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "Missing GitHub secret MANSHOCKEY_SYNC_TOKEN"
            exit 1
          fi
          curl --fail-with-body             -X POST             -H "Authorization: Bearer $SYNC_TOKEN"             -H "Accept: application/json"             https://manshockey.com/api/bchl-auto-sync
