name: Opponent Data Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check HockeyTech endpoint probe
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            https://manshockey.com/api/opponent-data-sync \
            | tee targets.json

          jq -e '.ok == true' targets.json >/dev/null

      - name: Probe HockeyTech endpoints
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            https://manshockey.com/api/opponent-data-sync \
            | tee probe.json

          jq -e '.ok == true' probe.json >/dev/null

          echo ""
          echo "=== E30.5.7 HOCKEYTECH ENDPOINT PROBE ==="
          jq -r '"Version: \(.version)"' probe.json
          jq -r '"Mode: \(.mode)"' probe.json
          jq '.summary' probe.json

          echo ""
          echo "=== LIKELY SCHEDULE EVIDENCE ==="
          jq '.likely_schedule_evidence' probe.json

          echo ""
          echo "=== FILE RESULTS ==="
          jq -c '.files[] | {
            url,
            status,
            chars,
            candidate_urls,
            route_like,
            http_calls,
            assignments,
            markers
          }' probe.json
