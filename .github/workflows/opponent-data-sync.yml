name: Opponent Data Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check HockeyTech parser fix
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            https://manshockey.com/api/opponent-data-sync \
            | tee targets.json

          jq -e '.ok == true' targets.json >/dev/null

      - name: Probe parsed HockeyTech schedule data
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            https://manshockey.com/api/opponent-data-sync \
            | tee probe.json

          jq -e '.ok == true' probe.json >/dev/null

          echo ""
          echo "=== E30.5.8.1 HOCKEYTECH PARSER FIX ==="
          jq -r '"Version: \(.version)"' probe.json
          jq -r '"Mode: \(.mode)"' probe.json

          echo ""
          echo "=== RESOLVED IDS ==="
          jq '.resolved' probe.json

          echo ""
          echo "=== BOOTSTRAP PARSE ==="
          jq '.bootstrap | {
            status,
            parse_ok,
            format,
            body_chars,
            top_level,
            arrays
          }' probe.json

          echo ""
          echo "=== SCHEDULE SUMMARY ==="
          jq -r '.schedule_results[] |
            "\(.name): status=\(.status), parse=\(.parse_ok), format=\(.format), chars=\(.body_chars), game_like=\(.game_like_rows|length), daily_games=\(.daily_games|length)"' probe.json

          echo ""
          echo "=== DAILY GAMES ==="
          jq '[.schedule_results[] |
            select(.name=="schedule-day") |
            .daily_games[]]' probe.json

          echo ""
          echo "=== FIRST GAME-LIKE ROWS ==="
          jq '[.schedule_results[] | {
            name,
            rows:(.game_like_rows[0:5])
          }]' probe.json
