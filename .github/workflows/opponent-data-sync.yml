name: Opponent Data Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check data source probe
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            https://manshockey.com/api/opponent-data-sync \
            | tee targets.json

          jq -e '.ok == true' targets.json >/dev/null

      - name: Probe BCHL data source
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            https://manshockey.com/api/opponent-data-sync \
            | tee probe.json

          jq -e '.ok == true' probe.json >/dev/null

          echo ""
          echo "=== E30.5.6 DATA SOURCE PROBE ==="
          jq -r '"Version: \(.version)"' probe.json
          jq -r '"Mode: \(.mode)"' probe.json
          jq -r '"Page: \(.page.url)"' probe.json
          jq -r '"External scripts: \(.counts.external_scripts)"' probe.json
          jq -r '"Inline scripts: \(.counts.inline_scripts)"' probe.json
          jq -r '"Iframes: \(.counts.iframes)"' probe.json
          jq -r '"Candidate URLs: \(.counts.discovered_candidate_urls)"' probe.json

          echo ""
          echo "=== EXTERNAL DATA HOSTS ==="
          jq '.external_data_hosts' probe.json

          echo ""
          echo "=== INTERESTING PAGE URLS ==="
          jq '.interesting_page_urls' probe.json

          echo ""
          echo "=== INLINE CANDIDATES ==="
          jq '.inline_candidates' probe.json

          echo ""
          echo "=== INSPECTED SCRIPT BUNDLES ==="
          jq '.inspected_scripts' probe.json

          echo ""
          echo "=== DISCOVERED CANDIDATE URLS ==="
          jq '.discovered_candidate_urls' probe.json
