name: Opponent Data Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check upcoming opponents
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $SYNC_TOKEN" https://manshockey.com/api/opponent-data-sync > targets.json
          cat targets.json
          jq -e '.ok==true' targets.json >/dev/null
      - name: Build league schedule cache once
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 90 --retry 1 --retry-delay 3 \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{}' \
            https://manshockey.com/api/opponent-data-sync > result.json
          cat result.json
          jq -e '.ok==true' result.json >/dev/null
          echo "Targets: $(jq -r '.targets' result.json)"
          echo "Pages fetched: $(jq -r '.pages_fetched' result.json) / $(jq -r '.pages_planned' result.json)"
          echo "Games found: $(jq -r '.games_found' result.json)"
          echo "Rows saved: $(jq -r '.saved' result.json)"
