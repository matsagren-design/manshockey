name: Opponent Data Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check direct HockeyTech probe
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            https://manshockey.com/api/opponent-data-sync \
            | tee targets.json

          jq -e '.ok == true' targets.json >/dev/null

      - name: Probe direct HockeyTech schedule feed
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            https://manshockey.com/api/opponent-data-sync \
            | tee probe.json

          jq -e '.ok == true' probe.json >/dev/null

          echo ""
          echo "=== E30.5.8 DIRECT HOCKEYTECH SCHEDULE PROBE ==="
          jq -r '"Version: \(.version)"' probe.json
          jq -r '"Mode: \(.mode)"' probe.json

          echo ""
          echo "=== RESOLVED IDS ==="
          jq '.resolved' probe.json

          echo ""
          echo "=== BOOTSTRAP ==="
          jq '.bootstrap' probe.json

          echo ""
          echo "=== SCHEDULE RESULTS ==="
          jq '.schedule_results' probe.json

          echo ""
          echo "=== GAME-LIKE ROW COUNTS ==="
          jq -r '.schedule_results[] | "\(.name): status=\(.status), parse=\(.parse_ok), rows=\(.game_like_rows|length), chars=\(.body_chars)"' probe.json
