name: Opponent Data Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
    - cron: '17 17 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check production sync
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            https://manshockey.com/api/opponent-data-sync \
            | tee targets.json

          jq -e '.ok == true' targets.json >/dev/null
          jq -e '.version == "E30.5.9"' targets.json >/dev/null

      - name: Sync HockeyTech opponent data
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --max-time 110 \
            -X POST \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            https://manshockey.com/api/opponent-data-sync \
            | tee sync.json

          jq -e '.ok == true' sync.json >/dev/null
          jq -e '.version == "E30.5.9"' sync.json >/dev/null

          echo ""
          echo "=== E30.5.9 PRODUCTION OPPONENT SYNC ==="
          jq -r '"Version: \(.version)"' sync.json
          jq -r '"Mode: \(.mode)"' sync.json
          jq -r '"Targets: \(.targets)"' sync.json
          jq -r '"Unique seasons fetched: \(.unique_seasons_fetched)"' sync.json
          jq -r '"Games saved: \(.games_saved)"' sync.json
          jq -r '"Intel cache cleared: \(.intel_cache_cleared)"' sync.json

          echo ""
          echo "=== PER OPPONENT ==="
          jq -r '.details[] |
            "\(.opponent): found=\(.found), saved=\(.saved), seasons=\([.selected_seasons[].name] | join(" | "))"' sync.json

          echo ""
          echo "=== SAVED GAMES ==="
          jq '[.details[] | {
            opponent,
            target_date,
            games
          }]' sync.json
