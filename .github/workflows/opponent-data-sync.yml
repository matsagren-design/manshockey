name: Opponent Data Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check parser probe
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            https://manshockey.com/api/opponent-data-sync \
            | tee targets.json

          jq -e '.ok == true' targets.json >/dev/null

      - name: Probe BCHL response structure
        env:
          SYNC_TOKEN: ${{ secrets.MANSHOCKEY_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            https://manshockey.com/api/opponent-data-sync \
            | tee probe.json

          echo ""
          echo "=== PROBE SUMMARY ==="
          jq -r '"Version: \(.version)"' probe.json
          jq -r '"Mode: \(.mode)"' probe.json
          jq -r '"Probe pages: \(.probe_pages)"' probe.json

          echo ""
          echo "=== PAGES ==="
          jq -c '.probes[] | {
            date,
            status,
            content_type,
            html_chars,
            text_chars,
            title,
            contains_final,
            contains_known_team,
            text_hits,
            raw_hits,
            first_text
          }' probe.json
